<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ô đặc biệt · FX & font</title><style>@font-face{font-family:Game;src:url('../../assets/fonts/baloo_2_extra_bold.ttf')}body{background:#182021;color:#eee5d3;font:16px/1.5 system-ui;margin:0}main{max-width:1120px;margin:auto;padding:24px}h1,.game{font-family:Game,system-ui}h1{font-size:38px}button,select{padding:8px 12px;background:#33413b;color:#eee5d3;border:1px solid #677265;border-radius:7px;font:inherit;cursor:pointer}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}canvas{max-width:100%;height:auto;border:1px solid #536153}#board{width:min(100%,700px)}.samples{font-family:Game;font-size:36px;color:#f4c567}.muted{color:#b9b9aa}a{color:#efc477}.error{color:#ffaaa1}</style><main><h1>Nổ ô đặc biệt</h1><p class="muted">Bảng 7×8, ô140px, canvas980×1120. Chọn hiệu ứng để xem atlas đã xuất trên đúng bảng gạch Orc. Đây là bản xem hình, không chạy luật resolver.</p><div class="row"><select id="effect"><option value="lightning">Sét · cả hàng và cột</option><option value="bomb">Bom · 3×3</option><option value="star">Sao · mọi ô cùng màu</option><option value="fusion">Hai ô đặc biệt · fusion</option></select><select id="color"><option value="red">Đỏ</option><option value="green">Xanh</option><option value="yellow">Vàng</option><option value="purple">Tím</option></select><button id="play">Phát lại</button><button id="pause">Tạm dừng</button><label><input id="bounds" type="checkbox" checked>Vùng ảnh hưởng</label></div><div class="row"><input id="frame" type="range" min="0" max="11" value="0"><span id="info"></span></div><p id="status">Đang tải…</p><canvas id="board" width="980" height="1120"></canvas><h2>Font Baloo 2 ExtraBold · SIL OFL</h2><div class="samples" id="samples"></div><p><a href="specials_fx_review/font_samples.png">Ảnh các chuỗi thử</a> · <a href="specials_fx.md">Hướng dẫn bàn giao</a></p></main><script src="specials_fx.js"></script><script>
(async()=>{if(new URLSearchParams(location.search).has('export'))return;const A=SpecialFxArt,S=SPECIAL_FX_SPEC,$=s=>document.querySelector(s),root=A.root,atlas={},palette={red:'#f15c4f',green:'#74c565',yellow:'#f1ca55',purple:'#b57ae5'};let t=0,playing=true,last=performance.now();
const load=(file)=>new Promise((res,rej)=>{const im=new Image();im.onload=()=>{atlas[file]=im;res()};im.onerror=()=>rej(Error(file));im.src=new URL('assets/fx/specials/'+file,root).href});
try{await A.ready;await Promise.all(Object.keys(S).map(load));await document.fonts.load('48px Game');}catch(e){$('#status').textContent='Không tải được '+e.message;$('#status').className='error';return}
const cv=$('#board'),ctx=cv.getContext('2d'),colors=['red','green','yellow','purple'];const cells=Array.from({length:56},(_,i)=>colors[(i*7+Math.floor(i/7)*2)%4]);
function effect(file,frame,x,y,rotation=0,tint=true){const s=S[file];if(frame>=s.frames)return;const c=document.createElement('canvas');c.width=s.frame_width;c.height=s.frame_height;const cctx=c.getContext('2d');cctx.drawImage(atlas[file],frame%8*s.frame_width,Math.floor(frame/8)*s.frame_height,s.frame_width,s.frame_height,0,0,s.frame_width,s.frame_height);if(tint){cctx.globalCompositeOperation='multiply';cctx.fillStyle=palette[$('#color').value];cctx.fillRect(0,0,c.width,c.height);cctx.globalCompositeOperation='destination-in';cctx.drawImage(atlas[file],frame%8*s.frame_width,Math.floor(frame/8)*s.frame_height,s.frame_width,s.frame_height,0,0,s.frame_width,s.frame_height)}ctx.save();ctx.translate(x,y);ctx.rotate(rotation);ctx.drawImage(c,-c.width/2,-c.height/2);ctx.restore()}
function render(){const mode=$('#effect').value,color=$('#color').value;ctx.fillStyle='#202b26';ctx.fillRect(0,0,980,1120);for(let i=0;i<56;i++)ctx.drawImage(A.images[cells[i]],i%7*140,Math.floor(i/7)*140,140,140);const f=Math.min(mode==='bomb'||mode==='star'?11:7,Math.floor(t*24));const cx=490,cy=490;if($('#bounds').checked){ctx.fillStyle='#ffefba22';ctx.strokeStyle='#fff2bd';ctx.lineWidth=3;if(mode==='bomb'){ctx.fillRect(280,280,420,420);ctx.strokeRect(280,280,420,420)}if(mode==='lightning'){ctx.fillRect(0,420,980,140);ctx.fillRect(420,0,140,1120)}if(mode==='star')for(let i=0;i<56;i++)if(cells[i]===color)ctx.strokeRect(i%7*140+5,Math.floor(i/7)*140+5,130,130)}
if(mode==='lightning'){for(let x=128;x<1108;x+=256)effect('lightning_beam.png',f,x,cy);for(let y=128;y<1248;y+=256)effect('lightning_beam.png',f,cx,y,Math.PI/2);effect('lightning_hub.png',f,cx,cy)}else if(mode==='bomb')effect('bomb_blast.png',f,cx,cy);else if(mode==='star'){effect('star_burst.png',f,cx,cy,0,false);for(let i=0;i<56;i++)if(cells[i]===color)effect('star_spark.png',Math.min(7,Math.floor(f*8/12)),i%7*140+70,Math.floor(i/7)*140+70,0,false)}else effect('fusion_flash.png',f,560,cy);$('#frame').max=mode==='bomb'||mode==='star'?11:7;$('#frame').value=f;$('#info').textContent='Frame '+f+' · '+(t*1000).toFixed(0)+'ms';}
$('#play').onclick=()=>{t=0;playing=true};$('#pause').onclick=()=>{playing=!playing;$('#pause').textContent=playing?'Tạm dừng':'Phát'};$('#effect').onchange=$('#color').onchange=()=>{t=0;playing=true;render()};$('#bounds').onchange=render;$('#frame').oninput=e=>{playing=false;t=Number(e.target.value)/24;render()};function tick(now){if(playing){t+=Math.min(.1,(now-last)/1000);const end=($('#effect').value==='bomb'||$('#effect').value==='star'?12:8)/24;if(t>end){t=end;playing=false}render()}last=now;requestAnimationFrame(tick)}requestAnimationFrame(tick);
$('#samples').innerHTML=['CHUỖI x3','NỐI 7!','CHIẾN THẮNG','THẤT BẠI','XÁO BẢNG','KHIÊN -10','+12 VÀNG','Ữ Ỗ Ặ Ẫ Ợ'].map(x=>'<div>'+x+'</div>').join('');$('#status').textContent='Đã tải đủ 6 atlas và font tiếng Việt';render();window.specialReview={render,set:(effect,frame)=>{$('#effect').value=effect;t=frame/24;playing=false;render()},ready:true};})();
</script></html>
